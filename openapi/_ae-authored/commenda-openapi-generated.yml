      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the registration
        corporation_id:
          type: string
          description: The corporation this registration belongs to
        registration_content_id:
          type: string
          description: Content ID identifying the jurisdiction and tax type
        jurisdiction_id:
          type: string
          description: Unique identifier for the jurisdiction
        jurisdiction_type:
          type: string
          description: 'Type: STATE_OR_PROVINCE , CITY , COUNTY , DISTRICT , LOCAL , COUNTRY , TERRITORY , TRADEBLOC'
        jurisdiction_name:
          type: string
          description: Human-readable name of the jurisdiction
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code
        state_or_province:
          type: string
          description: State or province code (e.g., “CA”, “TX”)
        tax_types:
          type: array
          description: Tax types registered for (e.g., ["RST", "DTT"] )
        frequency:
          type: string
          description: Filing frequency
        effective_start_date:
          type: string
          description: When the registration became effective (YYYY-MM-DD)
        effective_end_date:
          type: string
          description: When the registration ended (YYYY-MM-DD), if closed
        tax_registration_id:
          type: string
          description: State-issued tax ID or permit number
        portal_id:
          type: string
          description: Tax portal identifier
        credential_id:
          type: string
          description: Reference to stored portal credentials
        registration_status:
          type: string
          description: REGISTRATION_IN_PROGRESS or REGISTERED
        validation_status:
          type: string
          description: PENDING , VALIDATION_IN_PROGRESS , VALID , or INVALID
        registration_type:
          type: string
          description: EXISTING or NEW
        registered_by:
          type: string
          description: 'Who created the registration: API , USER , COMMENDA'
        email_alias:
          type: string
          description: Email alias for tax correspondence
        archived_at:
          type: string
          description: Timestamp if archived, otherwise null
        created_at:
          type: string
          description: When the registration was created
        updated_at:
          type: string
          description: When the registration was last updated
    GetWebhooksResponse:
      type: object
      properties:
        '200':
          type: string
          description: Sales tax registration response
        '400':
          type: string
          description: Bad request
    PostWebhooksRequest:
      type: object
      properties:
        api_version:
          type: string
          description: The version of the API for which you registered the webhook. This helps to maintain backward compatibility. If in newer
            versions the event payload is changed, your webhook will keep receiving the payload from this api version. This will be 'v1.0' for
            now and we will come up with more versions and a changelog later.
        name:
          type: string
          description: Optional name to define the purpose of the webhook.
        topics:
          type: array
          description: An array of topics to listen to. When any of these topics are triggered, the webhook will be pinged.
        url:
          type: string
          description: Your webhook url that will be hit once an event happens. Only HTTPS urls are allowed.
        key:
          type: string
          description: Secure string provided by the user. It will be used during HMCA process to keep the event payloads secure. Make sure to
            keep it safe as you will need it during validating event payloads. This key won't be returned back by any other endpoint.
        status:
          type: string
          description: If the webhook is active or not. If a webhook is disabled it won't be called when a topic is triggered.
      required:
      - api_version
      - topics
      - url
      - key
      - status
    PostWebhooksResponse:
      type: object
      properties:
        data:
          type: object
          description: CreateWebhookResponse object
        message:
          type: string
          description: Successfully registered webhook.
    GetWebhooksIdResponse:
      type: object
      properties:
        '200':
          type: string
          description: Sales tax registration response
        '400':
          type: string
          description: Bad request
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
